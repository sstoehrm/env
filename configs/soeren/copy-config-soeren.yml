---
# Deploy Soeren's configuration files.
# Run with: ansible-playbook configs/soeren/copy-config-soeren.yml
#
# Everything here lives under $HOME, so no privilege escalation is needed.
# Configs for tools this branch no longer installs (VS Code, WezTerm, kitty,
# ghostty, tmux) are kept in the repo as reference but are not deployed.

- name: Copy Soeren's Configurations
  hosts: localhost

  vars:
    config_files:
      # Herdr — the multiplexer on Omarchy (see playbooks/development/herdr.yml)
      - source: "herdr/config.toml"
        target: "{{ user_home }}/.config/herdr/config.toml"

  tasks:
    - name: Gather facts
      setup:

    - name: Set user variables
      set_fact:
        user: "{{ ansible_facts['user_id'] }}"
        user_home: "{{ ansible_facts['env']['HOME'] }}"
        configs_base: "{{ playbook_dir }}"

    # === Single-file configs ===

    - name: Create target directories for config files
      file:
        path: "{{ item.target | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ config_files }}"

    - name: Check if source config files exist
      stat:
        path: "{{ configs_base }}/{{ item.source }}"
      loop: "{{ config_files }}"
      register: source_files_check

    - name: Copy configuration files
      copy:
        src: "{{ configs_base }}/{{ item.item.source }}"
        dest: "{{ item.item.target }}"
        mode: "{{ item.item.mode | default('0644') }}"
        backup: yes
      loop: "{{ source_files_check.results }}"
      when: item.stat.exists

    - name: List missing configuration files
      debug:
        msg: "Configuration file not found: {{ item.item.source }}"
      loop: "{{ source_files_check.results }}"
      when: not item.stat.exists

    # === Neovim ===
    # Omarchy's omarchy-nvim package owns ~/.config/nvim. This copies over it
    # rather than replacing it: files omarchy-nvim ships that this config does
    # not name (remote_clipboard.lua, all-themes.lua, the theme hot-reload
    # plugin) are left in place, so they keep working.

    - name: Check whether Omarchy still owns the Neovim theme file
      stat:
        path: "{{ user_home }}/.config/nvim/lua/plugins/theme.lua"
        follow: no
      register: nvim_theme_link

    # Omarchy ships this path as a symlink to
    # ~/.local/state/omarchy/current/theme/neovim.lua, which omarchy-theme-set
    # rewrites on every theme switch. Removing the link first means our
    # theme.lua lands as a real file and the pinned colorscheme actually wins.
    - name: Remove Omarchy's generated Neovim theme symlink
      file:
        path: "{{ user_home }}/.config/nvim/lua/plugins/theme.lua"
        state: absent
      when: nvim_theme_link.stat.exists and nvim_theme_link.stat.islnk

    - name: Deploy Neovim configuration
      copy:
        src: "{{ configs_base }}/nvim/"
        dest: "{{ user_home }}/.config/nvim/"
        mode: "0644"
        directory_mode: "0755"
        backup: yes
        follow: no

    - name: Note what changed in the Neovim config
      debug:
        msg:
          - "Neovim config deployed over omarchy-nvim."
          - "theme.lua is now a real file, so `omarchy theme set` no longer retints Neovim."
          - "Run `nvim` once to let lazy.nvim install the extras in lazyvim.json."
