# Initial window size (matches wezterm.lua: 120x28).
# Kitty has no built-in "start maximized" config; launch with
# `kitty --start-as=maximized` if you want that behavior.
remember_window_size  no
initial_window_width  120c
initial_window_height 28c

# Tabs use a startup session that recreates the wezterm gui-startup layout.
startup_session ~/.config/kitty/startup.session

# Fonts and appearance
font_size 12

enabled_layouts splits,tall,grid,stack,fat

# Tab bar resembles wezterm's default — tabs along the top with current highlighted.
tab_bar_edge top

# --- Oxocarbon Dark color scheme (matches wezterm's "Oxocarbon Dark (Gogh)") ---
foreground            #ffffff
background            #161616
selection_foreground  #161616
selection_background  #c0c0c0
cursor                #ffffff
cursor_text_color     #161616
url_color             #be95ff

color0  #262626
color8  #393939
color1  #ff7eb6
color9  #ff7eb6
color2  #42be65
color10 #42be65
color3  #82cfff
color11 #82cfff
color4  #33b1ff
color12 #33b1ff
color5  #ee5396
color13 #ee5396
color6  #3ddbd9
color14 #3ddbd9
color7  #dde1e6
color15 #ffffff

# --- Key bindings ---
# Leader key: Ctrl+P (matches wezterm leader). Kitty chords use `>` between keys.
# The `kitty_mod` default (ctrl+shift) is left as-is for built-in chords; our
# leader-based bindings are independent.

# Pane navigation (Alt + h/j/k/l and arrows)
# Kitty captures these BEFORE tmux sees them, which blocks tmux's own pane
# navigation. Uncomment only when running kitty standalone (no tmux).
# map alt+h          neighboring_window left
# map alt+j          neighboring_window down
# map alt+k          neighboring_window up
# map alt+l          neighboring_window right
# map alt+left       neighboring_window left
# map alt+down       neighboring_window down
# map alt+up         neighboring_window up
# map alt+right      neighboring_window right

# Splits (require splits layout for the current tab)
# wezterm SplitVertical (current on top, new below) -> kitty hsplit
# wezterm SplitHorizontal (current left, new right) -> kitty vsplit
map ctrl+p>h       launch --location=hsplit --cwd=current
map ctrl+p>v       launch --location=vsplit --cwd=current

# Toggle "zoom" of current pane (kitty: toggle stack layout)
map ctrl+p>f       toggle_layout stack

# Close current pane with confirmation
map ctrl+p>q       close_window_with_confirmation

# Tab management
map ctrl+p>shift+c new_tab_with_cwd
map ctrl+p>shift+q close_tab_with_confirmation
map ctrl+p>shift+r set_tab_title

# Activate tab N (kitty goto_tab is 1-indexed; matches wezterm tabs 1..9)
map ctrl+p>1       goto_tab 1
map ctrl+p>2       goto_tab 2
map ctrl+p>3       goto_tab 3
map ctrl+p>4       goto_tab 4
map ctrl+p>5       goto_tab 5
map ctrl+p>6       goto_tab 6
map ctrl+p>7       goto_tab 7
map ctrl+p>8       goto_tab 8
map ctrl+p>9       goto_tab 9

# Prev/next tab
map ctrl+p>shift+h previous_tab
map ctrl+p>shift+l next_tab
map ctrl+p>shift+left  previous_tab
map ctrl+p>shift+right next_tab

# Scrollback / "copy mode" — kitty opens scrollback in $PAGER (less by default)
map ctrl+p>y       show_scrollback

# Resize mode — push a keyboard mode where hjkl resize, esc exits
map --new-mode resize_mode
map --mode resize_mode h resize_window narrower
map --mode resize_mode j resize_window shorter
map --mode resize_mode k resize_window taller
map --mode resize_mode l resize_window wider
map --mode resize_mode escape pop_keyboard_mode
map ctrl+p>r       push_keyboard_mode resize_mode

# Session save / restore (replaces wezterm-resurrect)
# Sessions are stored under ~/.local/share/kitty/sessions
map ctrl+p>shift+s save_as_session --use-foreground-process --base-dir ~/.local/share/kitty/sessions
map ctrl+p>shift+o goto_session ~/.local/share/kitty/sessions
