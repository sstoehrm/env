# Translated from configs/soeren/wezterm.lua and configs/soeren/kitty/kitty.conf
# Pairs with ghostty (per design: ghostty delegates multiplexing to tmux).

# --- Leader: Ctrl+P (matches wezterm/kitty leader) ---
unbind C-b
set -g prefix C-p
bind C-p send-prefix

# --- General ---
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB,xterm-kitty:RGB,wezterm:RGB"
set -ga terminal-overrides ",*:Tc"
set -g history-limit 100000

# Kitty graphics protocol passthrough (tmux 3.3+).
# Lets `kitten icat`, image.nvim, etc. render images through tmux on terminals
# that support the protocol (kitty, ghostty, wezterm).
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
setw -g mode-keys vi
set -g set-clipboard on
set -g focus-events on
set -s escape-time 0
setw -g aggressive-resize on
set -g default-command "${SHELL}"

# 1-based indexing so prefix+N (1..9) matches wezterm/kitty tabs 1..9
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Splits ---
# wezterm SplitVertical (current=top, new=bottom)    -> split-window -v
# wezterm SplitHorizontal (current=left, new=right)  -> split-window -h
unbind '"'
unbind %
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Pane zoom + close
bind f resize-pane -Z
bind q kill-pane

# --- Tabs (tmux "windows") ---
bind C new-window -c "#{pane_current_path}"
bind Q kill-window
bind R command-prompt -p "Tab name:" "rename-window '%%'"

# Activate tab N
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# Prev/next tab
bind H previous-window
bind L next-window
bind Left previous-window
bind Right next-window

# --- Pane navigation (no prefix; alt + hjkl/arrows) ---
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# --- Resize mode (sticky key table; matches wezterm key_tables.resize_mode) ---
bind r switch-client -T resize_mode
bind -T resize_mode h resize-pane -L 2 \; switch-client -T resize_mode
bind -T resize_mode j resize-pane -D 2 \; switch-client -T resize_mode
bind -T resize_mode k resize-pane -U 2 \; switch-client -T resize_mode
bind -T resize_mode l resize-pane -R 2 \; switch-client -T resize_mode
# Any unbound key (including Escape) drops back to root.

# --- Copy mode ---
bind y copy-mode
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
# Wayland variant — swap the two lines above for these if running under Wayland:
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Reload config (useful while iterating)
bind C-r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Status bar / theme (carbonfox) ---
# Palette
#   bg     #161616   black  #0c0c0c   gray   #282828
#   fg     #f2f4f8   red    #ee5396   green  #25be6a
#   yellow #08bdba   blue   #78a9ff   pink   #be95ff
#   cyan   #33b1ff   orange #ff7eb6
set -g status-position top
set -g status-bg "#161616"
set -g status-fg "#f2f4f8"
set -g status-left-length 20
set -g status-right-length 100

# Active tab: cyan background, dark fg (thm_black)
setw -g window-status-current-style "bg=#33b1ff,fg=#0c0c0c,bold"
# Inactive tab: muted fg on bg
setw -g window-status-style "fg=#f2f4f8,dim"

# Pane borders
set -g pane-border-style "fg=#282828"
set -g pane-active-border-style "fg=#33b1ff"

# Command/message prompt
set -g message-style "bg=#161616,fg=#08bdba"

# --- Session save/restore (tmux-resurrect, via tpm) ---
# Bindings rebound to match wezterm-resurrect: prefix+S saves, prefix+O restores.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @resurrect-save 'S'
set -g @resurrect-restore 'O'
set -g @resurrect-capture-pane-contents 'on'

# Initialize tpm (keep this line at the very bottom of the file)
run '~/.tmux/plugins/tpm/tpm'
