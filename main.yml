---
# Master playbook for development environment setup — Omarchy branch.
# Run with: ansible-playbook main.yml --ask-become-pass
# Or run specific sections with tags
#
# This branch assumes an Omarchy (Arch) host and only installs what Omarchy
# does not already ship. See README.md for the full list of what was dropped
# and why.
#
# Preferences are managed in preferences.json
# Copy preferences.example.json to preferences.json and customize

# Load preferences
- name: Load preferences
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check if preferences.json exists
      stat:
        path: "{{ playbook_dir }}/preferences.json"
      register: prefs_file

    - name: Fail if preferences.json not found
      fail:
        msg: |
          preferences.json not found!

          Please create it by copying the example:
            cp preferences.example.json preferences.json

          Then edit preferences.json to customize your installation.
      when: not prefs_file.stat.exists

    - name: Read preferences.json
      include_vars:
        file: "{{ playbook_dir }}/preferences.json"
        name: prefs

    - name: Refuse to run on a non-Omarchy host
      fail:
        msg: |
          This branch targets Omarchy. /etc/os-release does not report ID=omarchy.

          Use the main branch for Debian/Ubuntu or Fedora hosts.
      when: not (lookup('file', '/etc/os-release', errors='ignore') | default('', true)) is search('(?m)^ID=omarchy$')

    # Every lookup carries a default so a preferences.json carried over from the
    # main branch (which has keys this branch dropped) still runs.
    - name: Set preferences as facts
      set_fact:
        should_install_signal: "{{ prefs.install_signal | default(false) | bool }}"
        should_copy_soeren_configs: "{{ prefs.copy_soeren_configs | default(false) | bool }}"
        should_configure_git: "{{ prefs.configure_git | default(false) | bool }}"
        git_configured_name: "{{ prefs.git_user_name | default('') }}"
        git_configured_email: "{{ prefs.git_user_email | default('') }}"
        should_install_jvm: "{{ prefs.install_jvm | default(false) | bool }}"
        should_install_nodejs: "{{ prefs.install_nodejs | default(false) | bool }}"
        should_install_rust: "{{ prefs.install_rust | default(false) | bool }}"
        should_install_neovim: "{{ prefs.install_neovim | default(false) | bool }}"
        should_install_docker: "{{ prefs.install_docker | default(false) | bool }}"
        should_install_ast_grep: "{{ prefs.install_ast_grep | default(false) | bool }}"
        should_install_herdr: "{{ prefs.install_herdr | default(false) | bool }}"
        should_install_clojure: "{{ prefs.install_clojure | default(false) | bool }}"
        should_install_game_dev: "{{ prefs.install_game_dev | default(false) | bool }}"
        should_install_gcolor3: "{{ prefs.install_gcolor3 | default(false) | bool }}"
        cacheable: true

    - name: Display loaded preferences
      debug:
        msg:
          - "Loaded preferences:"
          - "  Signal: {{ should_install_signal }}"
          - "  Copy configs (herdr, Neovim, LSP servers): {{ should_copy_soeren_configs }}"
          - "  Git config: {{ should_configure_git }}"
          - "  JVM (mise): {{ should_install_jvm }}"
          - "  Node.js (mise): {{ should_install_nodejs }}"
          - "  Rust: {{ should_install_rust }}"
          - "  Neovim extras: {{ should_install_neovim }}"
          - "  Docker activation: {{ should_install_docker }}"
          - "  ast-grep: {{ should_install_ast_grep }}"
          - "  Herdr autostart: {{ should_install_herdr }}"
          - "  Clojure: {{ should_install_clojure }}"
          - "  Game dev: {{ should_install_game_dev }}"
          - "  Gcolor3: {{ should_install_gcolor3 }}"

# Applications Omarchy does not ship
- import_playbook: playbooks/base/signal.yml
  tags: [base, signal]
  when: hostvars['localhost']['should_install_signal'] | default(false)

# Configuration files. Deploys the herdr config and the Neovim config on top of
# omarchy-nvim; see configs/soeren/copy-config-soeren.yml for what that replaces.
- import_playbook: configs/soeren/copy-config-soeren.yml
  tags: [base, configs]
  when: hostvars['localhost']['should_copy_soeren_configs'] | default(false)

# LSP servers and formatters into ~/lsp/bin. This used to be gated behind Doom
# Emacs; with Doom gone it follows the configs flag. Note that the Neovim config
# installs most of the same servers through Mason — fnlfmt (used by conform),
# ols/odinfmt and zls are the ones only this playbook provides.
- import_playbook: configs/soeren/lsp/install-lsp-servers.yml
  tags: [base, lsp]
  when: hostvars['localhost']['should_copy_soeren_configs'] | default(false)

# Git configuration
- import_playbook: playbooks/development/git-config.yml
  tags: [base, git-config]
  when: hostvars['localhost']['should_configure_git'] | default(false)

# Language toolchains — all through mise, which Omarchy already ships and
# activates in its bash defaults.
- import_playbook: playbooks/development/java.yml
  tags: [base, java, mise]
  when: hostvars['localhost']['should_install_jvm'] | default(false)

- import_playbook: playbooks/development/kotlin.yml
  tags: [base, kotlin, mise]
  when: hostvars['localhost']['should_install_jvm'] | default(false)

- import_playbook: playbooks/development/maven.yml
  tags: [base, maven, mise]
  when: hostvars['localhost']['should_install_jvm'] | default(false)

- import_playbook: playbooks/development/gradle.yml
  tags: [base, gradle, mise]
  when: hostvars['localhost']['should_install_jvm'] | default(false)

- import_playbook: playbooks/development/visualvm.yml
  tags: [base, visualvm]
  when: hostvars['localhost']['should_install_jvm'] | default(false)

- import_playbook: playbooks/development/nodejs.yml
  tags: [base, nodejs, mise]
  when: hostvars['localhost']['should_install_nodejs'] | default(false)

- import_playbook: playbooks/development/rust.yml
  tags: [base, rust]
  when: hostvars['localhost']['should_install_rust'] | default(false)

# Neovim itself and the LazyVim base come from Omarchy's omarchy-nvim package;
# only the extras that config expects are installed here.
- import_playbook: playbooks/development/neovim-deps.yml
  tags: [base, neovim-deps]
  when: hostvars['localhost']['should_install_neovim'] | default(false)

- import_playbook: playbooks/development/nerdfonts.yml
  tags: [base, nerdfonts]
  when: hostvars['localhost']['should_install_neovim'] | default(false)

# Docker — Omarchy installs the packages but leaves the daemon off
- import_playbook: playbooks/development/docker.yml
  tags: [base, docker]
  when: hostvars['localhost']['should_install_docker'] | default(false)

- import_playbook: playbooks/development/portainer.yml
  tags: [base, portainer]
  when: hostvars['localhost']['should_install_docker'] | default(false)

# Development tools
- import_playbook: playbooks/development/ast-grep.yml
  tags: [base, ast-grep]
  when: hostvars['localhost']['should_install_ast_grep'] | default(false)

# Herdr is packaged by Omarchy; this only makes it claim interactive shells,
# in place of tmux.
- import_playbook: playbooks/development/herdr.yml
  tags: [base, herdr]
  when: hostvars['localhost']['should_install_herdr'] | default(false)

# Clojure
- import_playbook: playbooks/development/rlwrap.yml
  tags: [base, clojure, rlwrap]
  when: hostvars['localhost']['should_install_clojure'] | default(false)

- import_playbook: playbooks/development/babashka.yml
  tags: [base, clojure, babashka]
  when: hostvars['localhost']['should_install_clojure'] | default(false)

- import_playbook: playbooks/development/clojure-cli.yml
  tags: [base, clojure, clojure-cli, mise]
  when: hostvars['localhost']['should_install_clojure'] | default(false)

# Game development
- import_playbook: playbooks/development/odin.yml
  tags: [base, odin]
  when: hostvars['localhost']['should_install_game_dev'] | default(false)

- import_playbook: playbooks/development/blockbench.yml
  tags: [base, blockbench]
  when: hostvars['localhost']['should_install_game_dev'] | default(false)

# Applications
- import_playbook: playbooks/applications/gcolor3.yml
  tags: [base, gcolor3]
  when: hostvars['localhost']['should_install_gcolor3'] | default(false)
