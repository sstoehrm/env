---
# Omarchy binds hyprpicker for screen colour picking; gcolor3 is the
# standalone palette app, which Omarchy does not ship.
- name: Gcolor3 Color Picker
  hosts: localhost

  tasks:
    - name: Install Gcolor3
      become: yes
      become_method: sudo
      community.general.pacman:
        name: gcolor3
        state: present
