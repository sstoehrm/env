---
# `omarchy install dev-env clojure` is rlwrap + `mise use --global clojure`;
# this mirrors it instead of the upstream linux-install.sh script.
- name: Clojure CLI via mise
  hosts: localhost

  tasks:
    - name: Check whether Clojure is already registered with mise
      shell: mise ls --global --installed clojure
      register: mise_clojure
      changed_when: false
      failed_when: false

    - name: Install Clojure CLI
      command: mise use --global clojure@latest
      when: mise_clojure.stdout | default('') | trim == ''
