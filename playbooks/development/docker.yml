---
# Omarchy already installs docker, docker-buildx and docker-compose, but it
# leaves the daemon disabled and the user outside the docker group. Only that
# activation is left to do here.
- name: Docker
  hosts: localhost

  tasks:
    - name: Set user variables
      set_fact:
        user: "{{ ansible_user_id }}"

    - name: Add user to docker group
      become: yes
      become_method: sudo
      user:
        name: "{{ user }}"
        groups: docker
        append: yes

    - name: Ensure Docker service is started and enabled
      become: yes
      become_method: sudo
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Note that the group change needs a new session
      debug:
        msg: "Log out and back in (or run `newgrp docker`) before using docker without sudo."
