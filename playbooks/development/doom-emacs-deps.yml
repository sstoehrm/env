---
# Doom's icon set needs Symbols Nerd Font Mono, and its unicode fallback needs
# Symbola. Both are packaged on Arch, so no zip downloads are required.
- name: Doom Emacs Dependencies
  hosts: localhost

  tasks:
    - name: Install Symbols Nerd Font Mono
      become: yes
      become_method: sudo
      community.general.pacman:
        name: ttf-nerd-fonts-symbols-mono
        state: present

    - name: Install Symbola from the AUR
      # yay escalates on its own and must not run as root, so this needs a live
      # sudo timestamp (run `sudo -v` before the playbook). See README.
      command: omarchy-pkg-aur-add ttf-symbola
      register: symbola_install
      changed_when: "'is up to date' not in symbola_install.stdout"

    - name: Update font cache
      command: fc-cache -f
      changed_when: false
