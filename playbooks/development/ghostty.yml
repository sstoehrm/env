---
# Omarchy treats ghostty as one of its approved terminals. Installing the
# package through pacman first means `omarchy-install-terminal` finds it
# present and skips its own sudo call, doing only the parts that matter here:
# registering the desktop entry and making ghostty the default for
# xdg-terminal-exec (Super+Return). It leaves ~/.config/ghostty alone when the
# directory already exists, so the config from configs/soeren survives.
- name: Ghostty
  hosts: localhost

  tasks:
    - name: Install Ghostty
      become: yes
      become_method: sudo
      community.general.pacman:
        name: ghostty
        state: present

    - name: Check the current xdg-terminal-exec default
      command: cat {{ ansible_env.HOME }}/.config/xdg-terminals.list
      register: xdg_terminals
      changed_when: false
      failed_when: false

    - name: Register Ghostty as the Omarchy default terminal
      command: omarchy-install-terminal ghostty
      when: "'com.mitchellh.ghostty.desktop' not in (xdg_terminals.stdout | default(''))"
