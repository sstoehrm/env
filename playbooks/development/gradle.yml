---
- name: Gradle via mise
  hosts: localhost

  tasks:
    - name: Check whether Gradle is already registered with mise
      shell: mise ls --global --installed gradle
      register: mise_gradle
      changed_when: false
      failed_when: false

    - name: Install Gradle
      command: mise use --global gradle@latest
      when: mise_gradle.stdout | default('') | trim == ''
