---
# Omarchy packages herdr and already wires up its `h` alias and hdl/herdr shell
# functions, but it does not autostart it. This makes herdr the multiplexer that
# claims interactive shells, and removes the tmux autostart block this repo used
# to install so the two cannot nest.
- name: Herdr autostart
  hosts: localhost

  tasks:
    - name: Set user variables
      set_fact:
        user_home: "{{ ansible_env.HOME }}"

    - name: Remove tmux autostart from .bashrc
      blockinfile:
        path: "{{ user_home }}/.bashrc"
        marker: "# {mark} TMUX AUTOSTART"
        state: absent
        create: yes
        mode: '0644'

    - name: Remove zellij autostart from .bashrc
      blockinfile:
        path: "{{ user_home }}/.bashrc"
        marker: "# {mark} ZELLIJ AUTOSTART"
        state: absent
        create: yes
        mode: '0644'

    - name: Add herdr autostart to .bashrc
      blockinfile:
        path: "{{ user_home }}/.bashrc"
        marker: "# {mark} HERDR AUTOSTART"
        block: |
          # Attach to (or start) the persistent herdr session for interactive shells.
          # HERDR_ENV is set inside herdr-managed panes; the TMUX guard keeps herdr
          # from starting inside a tmux pane, since Omarchy still ships tmux.
          if command -v herdr &> /dev/null && [ -z "$HERDR_ENV" ] && [ -z "$TMUX" ]; then
              herdr
          fi
        create: yes
        mode: '0644'
