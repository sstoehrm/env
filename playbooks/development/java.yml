---
- name: Java via SDKMAN
  hosts: localhost
  vars:
    java_version: '25.0.5.0+8-tem'

  tasks:
    - name: Gather facts
      setup:

    - name: Set user variables
      set_fact:
        user: "{{ ansible_facts['user_id'] }}"
        user_home: "{{ ansible_facts['env']['HOME'] }}"
    - name: Install Java
      shell: |
        source '{{ user_home }}/.sdkman/bin/sdkman-init.sh'
        sdk install java {{ java_version }}
      args:
        executable: /bin/bash
