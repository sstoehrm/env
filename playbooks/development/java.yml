---
# Omarchy ships and activates mise, and `omarchy install dev-env java` uses it,
# so the JVM comes from mise here rather than from a second version manager.
- name: Java via mise
  hosts: localhost
  vars:
    java_version: 'temurin-21'

  tasks:
    - name: Check whether Java is already registered with mise
      shell: mise ls --global --installed java
      register: mise_java
      changed_when: false
      failed_when: false

    - name: Install Java
      command: mise use --global java@{{ java_version }}
      when: java_version not in (mise_java.stdout | default(''))
