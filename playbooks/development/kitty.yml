---
# Same approach as ghostty.yml: pacman installs the package (so
# omarchy-install-terminal needs no sudo of its own) and Omarchy then wires up
# the desktop entry and xdg-terminals.list. Note that whichever terminal
# playbook runs last wins as the Super+Return default — main.yml runs kitty
# before ghostty for that reason.
- name: Kitty
  hosts: localhost

  tasks:
    - name: Install Kitty
      become: yes
      become_method: sudo
      community.general.pacman:
        name: kitty
        state: present

    - name: Check the current xdg-terminal-exec default
      command: cat {{ ansible_env.HOME }}/.config/xdg-terminals.list
      register: xdg_terminals
      changed_when: false
      failed_when: false

    - name: Register Kitty as the Omarchy default terminal
      command: omarchy-install-terminal kitty
      when: "'kitty.desktop' not in (xdg_terminals.stdout | default(''))"
