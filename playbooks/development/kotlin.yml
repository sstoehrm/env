---
- name: Kotlin via mise
  hosts: localhost

  tasks:
    - name: Check whether Kotlin is already registered with mise
      shell: mise ls --global --installed kotlin
      register: mise_kotlin
      changed_when: false
      failed_when: false

    - name: Install Kotlin
      command: mise use --global kotlin@latest
      when: mise_kotlin.stdout | default('') | trim == ''
