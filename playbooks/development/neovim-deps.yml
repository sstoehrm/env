---
# Omarchy's omarchy-nvim package provides Neovim plus a pre-built LazyVim
# config, and base-devel, ripgrep, fzf, luarocks, imagemagick and wl-clipboard
# are already on the system. What is left are the extras that config expects.
- name: Neovim Extras
  hosts: localhost

  tasks:
    - name: Install remaining Neovim dependencies
      become: yes
      become_method: sudo
      community.general.pacman:
        name:
          - fish
          - tectonic   # LaTeX engine; upstream drop-sh installer not needed on Arch
        state: present

    - name: Install Mermaid CLI (mmdc) via mise-managed npm
      shell: npm install -g @mermaid-js/mermaid-cli
      args:
        executable: /bin/bash
      register: mmdc_install
      changed_when: "'added' in mmdc_install.stdout or 'updated' in mmdc_install.stdout"
