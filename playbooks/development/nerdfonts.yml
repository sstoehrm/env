---
# Omarchy ships ttf-jetbrains-mono-nerd-basic only; the remaining families the
# terminal configs can be pointed at come from [extra].
- name: Nerd Fonts
  hosts: localhost

  tasks:
    - name: Install Nerd Font families
      become: yes
      become_method: sudo
      community.general.pacman:
        name:
          - ttf-firacode-nerd
          - ttf-hack-nerd
          - ttf-jetbrains-mono-nerd
          - ttf-meslo-nerd
        state: present

    - name: Count installed Nerd Fonts
      shell: fc-list | grep -ci "nerd"
      register: nerdfonts_count
      changed_when: false

    - name: Display Nerd Fonts count
      debug:
        msg: "{{ nerdfonts_count.stdout }} Nerd Fonts installed"
