---
# Omarchy manages Node through mise (`omarchy install dev-env node` is just
# `mise use --global node`), so there is no NVM on this branch.
- name: Node.js via mise
  hosts: localhost
  vars:
    node_version: '24'

  tasks:
    - name: Check whether Node.js is already registered with mise
      shell: mise ls --global --installed node
      register: mise_node
      changed_when: false
      failed_when: false

    - name: Install Node.js
      command: mise use --global node@{{ node_version }}
      when: mise_node.stdout | default('') | trim == ''
