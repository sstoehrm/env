---
# Omarchy's `omarchy install dev-env rust` runs the rustup.rs shell installer;
# on Arch the packaged rustup is the same tool kept current by pacman and
# without a second copy under ~/.cargo, so this branch uses that instead.
- name: Rust
  hosts: localhost

  tasks:
    - name: Install rustup
      become: yes
      become_method: sudo
      community.general.pacman:
        name: rustup
        state: present

    - name: Check for an active toolchain
      command: rustup show active-toolchain
      register: rustup_toolchain
      changed_when: false
      failed_when: false

    - name: Install the stable toolchain
      command: rustup default stable
      when: rustup_toolchain.rc != 0
