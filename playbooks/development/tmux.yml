---
# tmux itself ships with Omarchy; only tpm is missing, and the soeren tmux.conf
# needs it for tmux-resurrect. No autostart block is added: Omarchy's
# multiplexer is herdr, and both claiming the shell would nest them.
- name: Tmux plugin manager
  hosts: localhost

  tasks:
    - name: Set user variables
      set_fact:
        user_home: "{{ ansible_env.HOME }}"

    - name: Install tpm (Tmux Plugin Manager)
      git:
        repo: https://github.com/tmux-plugins/tpm
        dest: "{{ user_home }}/.tmux/plugins/tpm"
        version: master
        update: no
        accept_hostkey: yes
