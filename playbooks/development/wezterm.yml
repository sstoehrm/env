---
# WezTerm is not one of Omarchy's approved terminals (no omarchy-install-terminal
# entry), so it is a plain package install and does not become the
# xdg-terminal-exec default.
- name: WezTerm
  hosts: localhost

  tasks:
    - name: Install WezTerm
      become: yes
      become_method: sudo
      community.general.pacman:
        name: wezterm
        state: present
