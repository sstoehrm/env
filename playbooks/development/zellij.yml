---
# Omarchy's multiplexer is herdr (packaged and wired into its bash defaults);
# zellij is an opt-in alternative and is not shipped.
- name: Zellij
  hosts: localhost

  tasks:
    - name: Install Zellij
      become: yes
      become_method: sudo
      community.general.pacman:
        name: zellij
        state: present

    - name: Set user variables
      set_fact:
        user_home: "{{ ansible_env.HOME }}"

    # Only one multiplexer should claim the shell; herdr's own autostart (if
    # enabled) and this block would otherwise nest.
    - name: Add Zellij autostart to .bashrc
      blockinfile:
        path: "{{ user_home }}/.bashrc"
        marker: "# {mark} ZELLIJ AUTOSTART"
        block: |
          # Auto-start Zellij if not already running
          if command -v zellij &> /dev/null && [ -z "$ZELLIJ" ] && [ -z "$HERDR_ENV" ]; then
            zellij attach -c main
          fi
        create: yes
        mode: '0644'
